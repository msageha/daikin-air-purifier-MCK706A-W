name: バグ報告
description: バグを報告して改善に協力する
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: バグの概要
      description: バグの内容を簡潔に説明してください
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どのように動作すべきか
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際にどのような動作になったか (API の status code と応答の本文。MAC アドレス・SSID・IP アドレスは伏せてください)
  - type: textarea
    id: env
    attributes:
      label: 環境情報
      value: |
        - 起動方法 (mise run dev / Docker):
        - 本体のファームウェア (GET /api/info の firmware):
        - このサーバーの commit (git rev-parse --short HEAD。Docker はイメージを build した時点の commit):
  - type: textarea
    id: notes
    attributes:
      label: 補足情報
      description: その他の関連情報があれば記載してください
