[project]
name = "daikin-mck706a-api"
version = "0.1.0"
description = "FastAPI wrapper around the local dsiot API of the Daikin MCK706A air purifier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.50.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "requests>=2.31",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "coverage>=7.15.0",
  "ruff>=0.15.20",
  "ty>=0.0.1a1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "N", "UP", "W"]
# 行長は formatter に任せる。
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
