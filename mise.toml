# ツールのバージョンは Renovate (mise manager) が bump し、mise.lock も同じ PR で更新する。
# latest 指定にしない。手で変更したときは `mise lock` を実行して mise.lock を追従させる。
# Python 本体は mise ではなく uv が管理する (pyproject.toml の requires-python に従って取得する)。
[tools]
uv = "0.13.8"
prek = "0.5.10"
actionlint = "1.7.12"
dprint = "0.64.3"
gitleaks = "8.30.1"
hadolint = "2.15.1"
typos = "1.52.2"
zizmor = "1.32.0"
# actionlint は PATH に shellcheck があるときだけ run: スクリプトを検査するため、
# ローカルと CI で検査内容が変わらないように pin する
shellcheck = "0.11.0"

[tasks.dev]
description = "開発サーバーを http://127.0.0.1:8000 で起動する。ソースを変えると自動で再起動する"
run = "uv run uvicorn main:app --reload --app-dir src --host 127.0.0.1 --port 8000"

[tasks.test]
description = "テストを並列に実行し、coverage を表示する。実機には接続しない"
# 計測は worker・API サーバーのプロセスごとの断片に分かれ、report がまとめて集計する。
# 中断した実行や、同じ checkout で並行して走る実行 (手動と pre-push の hook 等) の断片を混ぜないよう、
# 実行ごとの一時ディレクトリに置く。
run = """
#!/usr/bin/env bash
set -euo pipefail
data_dir="$(mktemp -d)"
trap 'rm -rf "$data_dir"' EXIT
export COVERAGE_FILE="$data_dir/.coverage"
uv run --locked coverage run -m pytest
uv run --locked coverage report
# main.py の lifespan は、subprocess で正常に起動した API サーバーでだけ実行される (起動に失敗するサーバーは
# その前に止まる)。計測されていなければ、子プロセスの計測が壊れている。
uv run --locked coverage json --include=src/main.py -q -o "$data_dir/main.json"
if ! uv run --locked python -c 'import json, sys; files = json.load(open(sys.argv[1]))["files"]; sys.exit(files["src/main.py"]["functions"]["lifespan"]["summary"]["covered_lines"] == 0)' "$data_dir/main.json"; then
  echo "lifespan in src/main.py was not measured: coverage of the API server subprocess is broken" >&2
  exit 1
fi
"""

[tasks.lint]
description = "Python の lint と整形 (ruff)、モジュール間の依存の向き (import-linter)、型 (ty) を検査する"
# 1 つ目の失敗で止めず、全部の検査の結果を出してから失敗を返す。
run = """
#!/usr/bin/env bash
status=0
uv run --locked ruff check . || status=1
uv run --locked ruff format --check . || status=1
PYTHONPATH=src uv run --locked lint-imports || status=1
uv run --locked ty check || status=1
exit "$status"
"""

[tasks.format]
description = "Python のファイルを整形し、import を並べ替える"
# ruff format は import を並べ替えないので、import の並びの規則 (I) の修正を先に適用する。
run = [
  "uv run --locked ruff check --select I --fix .",
  "uv run --locked ruff format .",
]

[tasks.pre-commit]
description = "commit 時の hook を、no-commit-to-branch を除いて git が追跡する全ファイルに実行する (CI の prek job の Run prek step と同じ検査)。整形する hook はファイルを書き換える"
# no-commit-to-branch は commit 先のブランチを見る hook で、検証には関係しない。main を checkout したままでも検証できるよう外す。
run = "SKIP=no-commit-to-branch prek run --all-files"

[tasks.build-image]
description = "Docker イメージ daikin-mck706a-api:latest を build する"
run = "docker build -t daikin-mck706a-api:latest ."

[tasks.run-image]
description = "Docker イメージを port 8000 で起動する。環境変数 DAIKIN_HOST・TIMEOUT をそのまま渡す"
# -e NAME (値なし) は設定されている変数だけを渡すので、未設定の任意項目にはアプリ (settings.py) の既定値が使われる
run = "docker run --rm -p 8000:8000 -e DAIKIN_HOST -e TIMEOUT daikin-mck706a-api:latest"

[tasks.clean]
description = "キャッシュと coverage の生成物を削除する"
run = [
  "find . -name '__pycache__' -type d -prune -exec rm -r {} +",
  "rm -rf .pytest_cache .ruff_cache .ty_cache .import_linter_cache .hypothesis htmlcov .coverage .coverage.*",
]

[tasks.docs]
description = "README.md のタスク一覧を、mise.toml のタスクの説明から作り直す"
# mise generate task-docs はタスクごとに見出しを作り、README の節と同じ階層に並ぶので、1 タスク 1 行の表にして埋め込む。
# mise tasks ls は親ディレクトリや mise.local.toml のタスクも列挙するので、このリポジトリの mise.toml だけを読む。
# 表は dprint が整形しない範囲 (dprint-ignore) に置く。整形すると、次の commit でこのタスクが書き戻して hook が失敗し続けるため。
run = '''
#!/usr/bin/env -S uv run --locked python
import tomllib
from pathlib import Path


def cell(task: object) -> str:
    # 説明の無いタスクと文字列だけで定義したタスクは空欄にする。改行は行を、| は列を崩すので置き換える。
    text = task.get("description", "") if isinstance(task, dict) else ""
    return " ".join(text.splitlines()).replace("|", r"\|")


tasks = tomllib.loads(Path("mise.toml").read_text(encoding="utf-8"))["tasks"]
rows = "".join(f"| `{name}` | {cell(tasks[name])} |\n" for name in sorted(tasks))
readme = Path("README.md")
head, rest = readme.read_text(encoding="utf-8").split("<!-- mise-tasks -->\n", 1)
_, tail = rest.split("<!-- /mise-tasks -->", 1)
table = f"<!-- mise-tasks -->\n| Task | 内容 |\n| --- | --- |\n{rows}<!-- /mise-tasks -->"
readme.write_text(head + table + tail, encoding="utf-8")
'''

# template から生成したリポジトリで実行し、共通ファイルが template の main からどれだけ離れたかを見る。
# README.md / CODEOWNERS / mise.lock はリポジトリ固有に書き換える前提なので対象外。
# CLAUDE.md・fnox.toml・claude.yaml・claude-sweep.yaml は、このリポジトリでは使わないので持たない (対象外)。
[tasks.template-diff]
description = "dope-corp/template から取り込んだ共通ファイルと、template の main との差分を表示する"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/template"
files=(
  .editorconfig .gitattributes .gitignore .pre-commit-config.yaml commitlint.config.mjs
  dprint.json mise.toml renovate.json
  .github/PULL_REQUEST_TEMPLATE.md
  .github/ISSUE_TEMPLATE/config.yml .github/ISSUE_TEMPLATE/bug_report.yaml .github/ISSUE_TEMPLATE/feature_request.yaml
  .github/workflows/ci.yaml
)
err="$(mktemp)"
trap 'rm -f "${err}"' EXIT
failed=0
for f in "${files[@]}"; do
  if ! upstream="$(gh api "repos/${repo}/contents/${f}" -H 'Accept: application/vnd.github.raw+json' 2>"${err}")"; then
    # 404 は template 側に無いファイル (skip)。それ以外 (未認証・通信障害・rate limit) は比較できていないので失敗にする
    if grep -q 'HTTP 404' "${err}"; then
      echo "!! ${f}: not in ${repo} main (skipped)"
    else
      echo "!! ${f}: fetch failed: $(cat "${err}")" >&2
      failed=1
    fi
    continue
  fi
  if [[ ! -f "${f}" ]]; then
    echo "!! ${f}: missing locally"
    continue
  fi
  diff -u --label "template/${f}" --label "${f}" <(printf '%s\n' "${upstream}") "${f}" || true
done
exit "${failed}"
'''

[hooks]
# uv sync で .venv を用意し、prek install で git hooks (pre-commit / pre-push / commit-msg / pre-merge-commit) を登録する。
# --locked: CI (mise install --locked) でもこの hook が走るため、ここで uv.lock を書き換えてしまうと
# 後続の uv run --locked が pyproject.toml との不整合を検出できなくなる
postinstall = """
uv sync --locked
prek install
"""

[settings]
lockfile = true
