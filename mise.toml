# ツールのバージョンは Renovate (mise manager) が bump し、mise.lock も同じ PR で更新する。
# latest 指定にしない。手で変更したときは `mise lock` を実行して mise.lock を追従させる。
# Python 本体は mise ではなく uv が管理する (pyproject.toml の requires-python に従って取得する)。
[tools]
uv = "0.13.7"
prek = "0.5.10"
actionlint = "1.7.12"
dprint = "0.64.3"
fnox = "v1.47.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
typos = "1.52.2"
zizmor = "1.32.0"
# actionlint は PATH に shellcheck があるときだけ run: スクリプトを検査するため、
# ローカルと CI で検査内容が変わらないように pin する
shellcheck = "0.11.0"
"npm:pyright" = "1.1.414"
# npm: backend が pyright を npm で入れるので、node も pin する
node = "26.13.1"

[tasks.dev]
description = "Run the API server with auto-reload on http://127.0.0.1:8000"
run = "uv run uvicorn main:app --reload --app-dir src --host 127.0.0.1 --port 8000"

[tasks.test]
description = "Run pytest under coverage and print the report"
run = [
  "uv run --locked coverage run -m pytest",
  "uv run --locked coverage report",
]

[tasks.lint]
description = "Check lint and formatting (ruff), layer dependencies (import-linter) and types (ty / pyright)"
# 1 つ目の失敗で止めず、全部の検査の結果を出してから失敗を返す。
run = """
#!/usr/bin/env bash
status=0
uv run --locked ruff check . || status=1
uv run --locked ruff format --check . || status=1
PYTHONPATH=src uv run --locked lint-imports || status=1
uv run --locked ty check || status=1
pyright || status=1
exit "$status"
"""

[tasks.format]
description = "Format python sources with ruff and sort imports"
# ruff format は import を並べ替えないので、import の並びの規則 (I) の修正を先に適用する。
run = [
  "uv run --locked ruff check --select I --fix .",
  "uv run --locked ruff format .",
]

[tasks.pre-commit]
description = "Run the pre-commit stage hooks on all tracked files with prek (same as the CI prek job)"
# no-commit-to-branch は commit 先のブランチを見る hook で、検証には関係しない。main を checkout したままでも検証できるよう外す。
run = "SKIP=no-commit-to-branch prek run --all-files"

[tasks.build-image]
description = "Build the Docker image daikin-mck706a-api:latest"
run = "docker build -t daikin-mck706a-api:latest ."

[tasks.run-image]
description = "Run the Docker image on port 8000 with the settings from the environment"
# -e NAME (値なし) は設定されている変数だけを渡すので、未設定の任意項目にはアプリ (settings.py) の既定値が使われる
run = "docker run --rm -p 8000:8000 -e DAIKIN_HOST -e TIMEOUT daikin-mck706a-api:latest"

[tasks.clean]
description = "Remove caches and coverage artifacts"
run = [
  "find . -name '__pycache__' -type d -prune -exec rm -r {} +",
  "rm -rf .pytest_cache .ruff_cache .ty_cache .import_linter_cache htmlcov .coverage",
]

[tasks.docs]
description = "Sync the task list embedded in README.md with mise.toml"
run = "mise generate task-docs --inject --output README.md"

# template から生成したリポジトリで実行し、共通ファイルが template の main からどれだけ離れたかを見る。
# README.md / CODEOWNERS / CLAUDE.md / mise.lock はリポジトリ固有に書き換える前提なので対象外。
# claude.yaml / claude-sweep.yaml は GitHub 経由で Claude を使わないため持たない (対象外)。
[tasks.template-diff]
description = "Diff shared files against dope-corp/template main"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/template"
files=(
  .editorconfig .gitattributes .gitignore .pre-commit-config.yaml commitlint.config.mjs
  dprint.json fnox.toml mise.toml renovate.json
  .github/PULL_REQUEST_TEMPLATE.md
  .github/ISSUE_TEMPLATE/config.yml .github/ISSUE_TEMPLATE/bug_report.yaml .github/ISSUE_TEMPLATE/feature_request.yaml
  .github/workflows/ci.yaml
)
err="$(mktemp)"
trap 'rm -f "${err}"' EXIT
failed=0
for f in "${files[@]}"; do
  if ! upstream="$(gh api "repos/${repo}/contents/${f}" -H 'Accept: application/vnd.github.raw+json' 2>"${err}")"; then
    # 404 は template 側に無いファイル (skip)。それ以外 (未認証・通信障害・rate limit) は比較できていないので失敗にする
    if grep -q 'HTTP 404' "${err}"; then
      echo "!! ${f}: not in ${repo} main (skipped)"
    else
      echo "!! ${f}: fetch failed: $(cat "${err}")" >&2
      failed=1
    fi
    continue
  fi
  if [[ ! -f "${f}" ]]; then
    echo "!! ${f}: missing locally"
    continue
  fi
  diff -u --label "template/${f}" --label "${f}" <(printf '%s\n' "${upstream}") "${f}" || true
done
exit "${failed}"
'''

[hooks]
# uv sync で .venv を用意し、prek install で git hooks (pre-commit / pre-push / commit-msg) を登録する。
# --locked: CI (mise install --locked) でもこの hook が走るため、ここで uv.lock を書き換えてしまうと
# 後続の uv run --locked が pyproject.toml との不整合を検出できなくなる
postinstall = """
uv sync --locked
prek install
"""

[settings]
lockfile = true
